# Local kernel-upgrade checks. The full workspace remains a CI check.
[profile.quiddity-upgrade]
test-threads = 6
fail-fast = false
default-filter = '''
  package(specify-core-wasm)
  | binary(specify_core)
  | binary(kernel_upgrade) | binary(features) | binary(resume)
  | binary(cross_engine) | binary(rules_oracle) | binary(cli)
  | binary(api) | binary(bytes_api) | binary(assemblies) | binary(assembly_write)
  | binary(existing) | binary(writer) | binary(writer_attributes) | binary(write_oracle)
  | binary(pmi_provenance) | binary(part_notes) | binary(problems)
  | binary(rules) | binary(datums) | binary(turned_defaults) | binary(profile_runout)
  | binary(locations) | binary(anchors) | binary(mates) | binary(general)
  | binary(rust_analyses) | binary(default_suggestions) | binary(oracle_harness)
  | binary(known_differences_doc)
'''
