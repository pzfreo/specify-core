name: Python package

# The specify-core Python package (crates/specify-core-py): an abi3 wheel per platform and an
# sdist. Each wheel is installed and its smoke suite (tests/python) run on CPython 3.12, and the
# Linux x86_64 wheel on the newest CPython too, as abi3 promises. Published to PyPI for a
# release. A change to the package, the engine or this workflow builds and tests on its pull
# request, without publishing.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'crates/specify-core-py/**'
      - 'tests/python/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64, manylinux: '2_28' }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: '2_28' }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      # rustc's thin-LTO threads overflow Windows' default stack on step-io (as cli.yml).
      RUST_MIN_STACK: '67108864'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      # The package's LICENSE and NOTICE are links to the repository's; a Windows checkout
      # makes a link a text file holding its target, so it gets the files themselves.
      - if: runner.os == 'Windows'
        run: |
          rm crates/specify-core-py/LICENSE crates/specify-core-py/NOTICE
          cp LICENSE NOTICE crates/specify-core-py/
      # The toolchain comes from rust-toolchain.toml.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked -m crates/specify-core-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: -m crates/specify-core-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, python: '3.12' }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, python: '3.12' }
          - { name: macos-arm64, os: macos-latest, python: '3.12' }
          - { name: macos-x86_64, os: macos-15-intel, python: '3.12' }
          - { name: windows-x64, os: windows-latest, python: '3.12' }
          # The abi3 wheel on the newest CPython.
          - { name: linux-x86_64, os: ubuntu-22.04, python: '3.15' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv venv --python ${{ matrix.python }} .venv
      - name: Install the wheel, and pytest
        run: |
          uv pip install --python .venv pytest
          uv pip install --python .venv --no-index --find-links dist specify-core
      - name: The wheel carries the licence
        run: |
          .venv/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/python - <<'EOF'
          import glob, zipfile
          (wheel,) = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          for name in ("LICENSE", "NOTICE"):
              (found,) = [n for n in names if n.endswith(".dist-info/licenses/" + name)]
              text = zipfile.ZipFile(wheel).read(found).decode()
              assert len(text) > 100, (found, text)
          EOF
      - run: .venv/${{ runner.os == 'Windows' && 'Scripts' || 'bin' }}/python -m pytest tests/python -q

  publish:
    needs: [wheels, sdist, test]
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
