name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The toolchain comes from rust-toolchain.toml. quiddity-rust is a public git dependency,
      # pinned by Cargo.lock. Quiddity's STEP corpus is not checked out: tests whose input is a
      # corpus file skip without it (QUIDDITY_CORPUS); tests on committed fixtures always run.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test --release

  wasm:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # API acknowledgement is compared with the PR base / previous push.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: wasm-pack build crates/specify-core-wasm --target web --profile wasm-release --locked
      - name: Check WASM API snapshot and changelog
        env:
          API_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$API_BASE" ] || [ "$API_BASE" = "0000000000000000000000000000000000000000" ]; then
            API_BASE=$(git hash-object -t tree -w --stdin < /dev/null)
          fi
          python3 tools/check_wasm_api.py --base-ref "$API_BASE"
      - run: python3 tools/wasm_size.py
      - name: Compare released editor kernel (advisory)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check_quiddity_pin.py
      - run: cargo build --locked --release -p specify-core-wasm --example parity_reference
      - run: node scripts/wasm-parity.mjs
      - run: node scripts/wasm-hostile.mjs
