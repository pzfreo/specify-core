name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity/tests/corpus
      SPECIFY_CORPUS: ${{ github.workspace }}/quiddity/tests/corpus
      QUIDDITY_CORPUS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Same corpus revision and sparse checkout as quiddity-rust's suite.yml.
      # Tests select Specify's regressions from tests/common/corpus.rs; the full sweep
      # is a local opt-in (SPECIFY_CORPUS_ALL=1), not a CI tier.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pzfreo/quiddity
          ref: 6d544e060cd0eeb4442d2196e5df757b5a15ea55
          path: quiddity
          sparse-checkout: tests/corpus
      # The toolchain comes from rust-toolchain.toml. quiddity-rust is a public git dependency,
      # pinned by Cargo.lock.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      # Maintainer decision, 2026-10-26: macOS PRs build and run only float-sensitive
      # expectations; five macOS runners are shared across repos, so reduce runner-minutes
      # rather than add jobs/shards. Linux always runs everything. Main, dispatch and
      # release* PR heads retain the full macOS suite.
      - name: Build the workspace and every test
        run: cargo test --workspace --release --locked --no-run
      - name: Full suite
        if: runner.os != 'macOS' || github.event_name != 'pull_request' || startsWith(github.head_ref, 'release')
        run: cargo test --workspace --release --locked --no-fail-fast
      - name: macOS PR floating-point checks
        if: runner.os == 'macOS' && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release')
        # features: libm-dependent frame/recognition and rounded face records.
        # mesh: acos/sin, UV refinement, triangle winding/area and rounded bounds.
        # anchors: geometric integration and six-decimal leader positions/directions.
        # schema6: rotated slot end planes, frame roll and PMI coordinates.
        # resume: rounded centroids, signed zero and persisted fingerprint hashes.
        # revision: geometric correspondence, rounded report measurements and PNG projection.
        # pyfmt: exact binary rounding/formatting used by all these expectations.
        run: >-
          cargo test --release --locked --no-fail-fast
          --test features --test mesh --test anchors --test schema6
          --test resume --test revision --test pyfmt

  wasm:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # API acknowledgement is compared with the PR base / previous push.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: wasm-pack build crates/specify-core-wasm --target web --profile wasm-release --locked
      - name: Check WASM API snapshot and changelog
        env:
          API_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          if [ -z "$API_BASE" ] || [ "$API_BASE" = "0000000000000000000000000000000000000000" ]; then
            API_BASE=$(git hash-object -t tree -w --stdin < /dev/null)
          fi
          python3 tools/check_wasm_api.py --base-ref "$API_BASE"
      - run: python3 tools/wasm_size.py
      - name: Compare released editor kernel (advisory)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check_quiddity_pin.py
      - run: cargo build --locked --release -p specify-core-wasm --example parity_reference
      - run: node scripts/wasm-parity.mjs
      - run: node scripts/wasm-hostile.mjs
