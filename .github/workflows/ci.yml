name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Path filters on pull requests (the `changes` job): docs-only changes skip both suites, and a
# ui-only change skips Rust. A PR with no ui/ or shared files skips the UI jobs. Shared files
# run both: the workflows, the root manifests, the engine (all of src/, compiled into the WASM the
# UI and the app run), the session contract (docs/open.md, docs/session.md), the app job's fixture and
# the WASM crate. Pushes to main and manual runs run everything; releases run release.yml. A
# skipped job is not a failure: `ci-ok` is the one check branch protection requires.
# Job timeouts allow roughly twice the cold-cache duration. The 25-minute target
# excludes full macOS runs, which use one runner to limit shared runner usage.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # the PR's base and head, for the files it changes
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT" != pull_request ]; then
            echo "Not a pull request: everything runs."
            printf 'rust=true\nui=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rust=false
          ui=false
          # The files the PR changes (since it left its base).
          files="$RUNNER_TEMP/changed-paths"
          git diff --name-only --no-renames -z "$BASE...$HEAD" > "$files"
          while IFS= read -r -d '' file; do
            case "$file" in
              '') ;;
              ui/*) ui=true ;;
              # The engine (src/) is compiled into the WASM the UI and the app run, so an engine
              # change is tested by the ui and app jobs too. Only a ui-only change skips Rust.
              .github/*|Cargo.toml|Cargo.lock|build.rs|tools/open_smoke.py|tests/fixtures/bundle/*|rust-toolchain.toml|docs/open.md|docs/session.md|src/*|tests/fixtures/thread-depth-alpha7.step.gz|crates/specify-core-wasm/*)
                rust=true; ui=true ;;
              # Packaging and the WASM API acknowledgement read the README and changelog.
              # Rust checks these docs or exercises the contracts they describe.
              README.md|CHANGELOG.md|docs/answers.md|docs/design.md|docs/face-names.md|docs/ids.md|docs/known-differences.md|docs/mcp.md|docs/process.md|docs/rule-sources.md)
                rust=true ;;
              docs/*|proposals/*) ;;
              */*) rust=true ;;
              *.md) ;;
              *) rust=true ;;
            esac
          done < "$files"
          echo "rust=$rust ui=$ui"
          printf 'rust=%s\nui=%s\n' "$rust" "$ui" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/ci-rust.yml

  # Browser jobs start as soon as the package is available.
  wasm-build:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      CARGO_TERM_COLOR: always
      WASM_PACK_CACHE: ${{ github.workspace }}/.cache/wasm-pack
    steps:
      - &checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: wasm-pack@0.15.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm-package
          cache-directories: ${{ env.WASM_PACK_CACHE }}
      - run: wasm-pack build crates/specify-core-wasm --target web --profile wasm-release --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-pkg
          path: crates/specify-core-wasm/pkg
          if-no-files-found: error

  wasm-checks:
    needs: [changes, wasm-build]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_CHECKS: ${{ needs.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # API acknowledgement is compared with the PR base / previous push.
      - name: Python and Cargo versions are lockstep
        run: python3 tools/release_version.py --check-lockstep
      - if: env.RUST_CHECKS == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - if: env.RUST_CHECKS == 'true'
        run: rustup toolchain install
      - if: env.RUST_CHECKS == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm-parity
      - if: env.RUST_CHECKS == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: crates/specify-core-wasm/pkg
      - if: env.RUST_CHECKS == 'true'
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check WASM API snapshot and changelog
        if: env.RUST_CHECKS == 'true'
        env:
          API_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          if [ -z "$API_BASE" ] || [ "$API_BASE" = "0000000000000000000000000000000000000000" ]; then
            API_BASE=$(git hash-object -t tree -w --stdin < /dev/null)
          fi
          python3 tools/check_wasm_api.py --base-ref "$API_BASE"
      - if: env.RUST_CHECKS == 'true'
        run: python3 tools/wasm_size.py
      - name: The npm package packs (release.yml publishes it)
        if: env.RUST_CHECKS == 'true'
        run: |
          cp -R crates/specify-core-wasm/pkg "$RUNNER_TEMP/npm-pkg"
          cp NOTICE "$RUNNER_TEMP/npm-pkg/NOTICE" # as release.yml does before archiving
          python3 tools/npm_package.py "$RUNNER_TEMP/npm-pkg" --check-pack
      - name: Compare released editor kernel (advisory)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check_quiddity_pin.py
      - if: env.RUST_CHECKS == 'true'
        run: cargo build --locked --release -p specify-core-wasm --example parity_reference
      - if: env.RUST_CHECKS == 'true'
        run: node scripts/wasm-parity.mjs
      - if: env.RUST_CHECKS == 'true'
        run: node scripts/wasm-face-names.mjs
      - if: env.RUST_CHECKS == 'true'
        run: node scripts/wasm-limits.mjs
      - if: env.RUST_CHECKS == 'true'
        run: node scripts/wasm-hostile.mjs

  # Build the library and pack it once for all three independent host runs.
  ui:
    needs: [changes, wasm-build]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - *checkout
      - &download_wasm
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: crates/specify-core-wasm/pkg
      - &ui_node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - &ui_install
        run: npm ci
        working-directory: ui
      - &ui_wasm
        name: Install the in-repo engine into public/wasm/intent
        run: npm run fetch:wasm
        working-directory: ui
      - run: npm run build # includes npm run typecheck
        working-directory: ui
      - run: npm test
        working-directory: ui
      - name: Show the package contents
        run: npm pack --dry-run --ignore-scripts
        working-directory: ui
      - name: Pack the release tarball
        run: node scripts/pack.mjs "$RUNNER_TEMP/ui-tarball"
        working-directory: ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-tarball
          path: ${{ runner.temp }}/ui-tarball/*.tgz
          if-no-files-found: error

  ui-browser:
    needs: [changes, wasm-build]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - *checkout
      - *download_wasm
      - *ui_node
      - *ui_install
      - *ui_wasm
      - &playwright_cache
        name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - &playwright_install
        run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm run test:browser
        working-directory: ui

  ui-package:
    needs: [changes, wasm-build, ui]
    if: needs.changes.outputs.ui == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The default local test:package runs this same set, in order.
        three: [pinned, '0.186.1', '0.187.0']
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - *checkout
      - *download_wasm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-tarball
          path: ui/.cache/ci-package
      - *ui_node
      - *ui_install
      - *ui_wasm
      - *playwright_cache
      - *playwright_install
      - name: Test the packed tarball in a host app
        env:
          THREE_VERSION: ${{ matrix.three }}
        run: npm run test:package -- "$THREE_VERSION" .cache/ci-package/*.tgz
        working-directory: ui

  # Both browser suites exercise one branch-built command with the built-in app (ADR P12).
  app-build:
    needs: [changes, wasm-build]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CARGO_TERM_COLOR: always
    steps:
      - *checkout
      - *download_wasm
      - *ui_node
      - *ui_install
      - *ui_wasm
      - run: npm run build:app
        working-directory: ui
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: app-cli-app # reuse the former app job's cache
      - name: Build the specify-core command with the app and engine
        env:
          SPECIFY_REQUIRE_BUNDLE: '1'
        run: cargo build --release --locked --bin specify-core
      - name: Open serves the built-in app and engine
        run: |
          gunzip -c tests/fixtures/thread-depth-alpha7.step.gz > "$RUNNER_TEMP/part.step"
          python3 tools/open_smoke.py target/release/specify-core "$RUNNER_TEMP/part.step"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-cli
          path: target/release/specify-core
          if-no-files-found: error

  app:
    needs: [changes, wasm-build, app-build]
    if: needs.changes.outputs.ui == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [app-browser, app-agent]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - *checkout
      - *download_wasm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-cli
          path: target/release
      - run: chmod +x target/release/specify-core
      - *ui_node
      - *ui_install
      - *ui_wasm
      - *playwright_cache
      - *playwright_install
      - name: The app served from the command
        working-directory: ui
        env:
          SPECIFY_CORE: ${{ github.workspace }}/target/release/specify-core
          SPECIFY_APP_BUILT_IN: '1'
          APP_SUITE: ${{ matrix.suite }}
        run: node "test/$APP_SUITE.mjs"

  # The one required check: passes when every job above passed or was skipped by the path
  # filter, fails when any failed or was cancelled.
  ci-ok:
    needs: [changes, test, wasm-build, wasm-checks, ui, ui-browser, ui-package, app-build, app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A CI job ended $result."; exit 1 ;;
            esac
          done
