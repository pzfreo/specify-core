name: Release command line

# The specify-core command line for Linux, macOS and Windows, attached to each release. A change to
# this workflow builds and tries all three on its pull request, without attaching anything.
on:
  release:
    types: [published]
  pull_request:
    paths: ['.github/workflows/cli.yml']

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, exe: '' }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: .exe }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      # rustc's thin-LTO threads overflow Windows' default stack on step-io.
      RUST_MIN_STACK: '67108864'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cli-${{ matrix.target }}
      - run: cargo build --locked --release --bin specify-core --target ${{ matrix.target }}
      - name: Try it on a revision
        # The hole_removed pair: one entry renumbers with its hole, one is set aside with the
        # removed hole.
        run: |
          bin="target/${{ matrix.target }}/release/specify-core${{ matrix.exe }}"
          fixtures=tests/fixtures/revisions
          echo '{"hole.function:holes:7": "fit:H7", "hole.function:holes:9": "general"}' > given.json
          printed=$("$bin" diff $fixtures/hole_removed.old.step.gz $fixtures/hole_removed.new.step.gz --answers given.json -o smoke)
          echo "$printed"
          echo "$printed" | grep -q '"verdict": *"decide"'
          cat smoke/answers.json
          # The ⌀6 hole's answer follows it from faces 9 to 8.
          grep -q '"hole.function:holes:8": *"general"' smoke/answers.json && ! grep -q 'holes:9' smoke/answers.json
      - name: Package and checksum
        run: |
          name="specify-core-${RELEASE_TAG:-pr}-${{ matrix.target }}"
          mkdir -p dist "$name"
          cp "target/${{ matrix.target }}/release/specify-core${{ matrix.exe }}" LICENSE README.md "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            asset="$name.zip"; 7z a -bd "dist/$asset" "$name" > /dev/null
          else
            asset="$name.tar.gz"; tar -czf "dist/$asset" "$name"
          fi
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum "$asset"; else shasum -a 256 "$asset"; fi > "$asset.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Only this job can write to the repository, and only for a release.
  attach:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Attach to this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
