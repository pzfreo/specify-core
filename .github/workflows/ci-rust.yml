name: Rust CI

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      shards:
        required: true
        type: string
      build-timeout:
        required: true
        type: number
      shard-timeout:
        required: true
        type: number
      full-suite:
        required: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity-corpus
  SPECIFY_CORPUS: ${{ github.workspace }}/quiddity-corpus
  QUIDDITY_CORPUS_REQUIRED: "1"

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.build-timeout }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Same corpus revision as pzfreo/quiddity. tests/common/corpus.rs selects the CI cases.
      - &corpus
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: quiddity-corpus
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - &nextest
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-nextest@0.9.148
      - name: STEP diff comment regression
        if: runner.os == 'Linux'
        run: bash step-diff/tests/comment.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - name: Build and archive the workspace and every test
        if: inputs.full-suite
        run: cargo nextest archive --workspace --release --locked --zstd-level 1 --archive-file tests.tar.zst
      - name: Upload test archive
        if: inputs.full-suite
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-tests-${{ inputs.os }}
          path: tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Doctests
        if: inputs.full-suite
        run: cargo test --doc --workspace --release --locked --no-fail-fast
      - name: macOS PR floating-point checks
        if: ${{ !inputs.full-suite }}
        # features: libm-dependent frame/recognition and rounded face records.
        # mesh: acos/sin, UV refinement, triangle winding/area and rounded bounds.
        # anchors: geometric integration and six-decimal leader positions/directions.
        # schema6: rotated slot end planes, frame roll and PMI coordinates.
        # resume: rounded centroids, signed zero and persisted fingerprint hashes.
        # revision: geometric correspondence, rounded report measurements and PNG projection.
        # characteristic_numbers: macOS-captured legacy serialization hashes.
        # pyfmt: exact binary rounding/formatting used by all these expectations.
        run: >-
          cargo nextest run --release --locked --no-fail-fast
          --test features --test mesh --test anchors --test schema6
          --test resume --test revision --test pyfmt --test characteristic_numbers

  shard:
    needs: build
    if: inputs.full-suite
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.shard-timeout }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - *corpus
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Isolate the archive's target/ from the build job's Cargo cache.
          key: test-shard
          cache-targets: false
          save-if: false
      - *nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-tests-${{ inputs.os }}
      - name: Run the archived tests
        # Each runner of the same OS has the same checkout path. Restore target/ there for
        # tests that use Cargo's compile-time paths to the CLI binary and scratch directory.
        run: |
          mkdir -p target/tmp
          cargo nextest run --archive-file tests.tar.zst --extract-to . --extract-overwrite --no-fail-fast \
            --partition hash:${{ matrix.shard }}/${{ strategy.job-total }}
