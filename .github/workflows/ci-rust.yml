name: Rust CI

on:
  workflow_call:
  # The full macOS suite, nightly and on demand (before a release). Run directly, these
  # triggers skip the Linux jobs, which every push and pull request already runs (ci.yml).
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      macos_only:
        description: Run only the macOS job (untick to run Linux as well)
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  QUIDDITY_CORPUS: ${{ github.workspace }}/quiddity-corpus
  SPECIFY_CORPUS: ${{ github.workspace }}/quiddity-corpus
  QUIDDITY_CORPUS_REQUIRED: "1"

jobs:
  build:
    if: ${{ github.event_name != 'schedule' && !inputs.macos_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Same corpus revision as pzfreo/quiddity. tests/common/corpus.rs selects the CI cases.
      - &corpus
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: pzfreo/quiddity-corpus
          ref: 3ef06590a7a27ed65ca1f1a6e7f7ea4d5c328f1f
          path: quiddity-corpus
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-test-archive
      - &nextest
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-nextest@0.9.148
      - name: STEP diff comment regression
        run: bash step-diff/tests/comment.sh
      - &fmt
        run: cargo fmt --all --check
      - &clippy
        run: cargo clippy --workspace --all-targets --release -- -D warnings
      - name: Fetch dependencies for shard metadata checks
        # The schema test resolves dependencies for all platforms, including wasm32.
        run: cargo fetch --locked
      - name: Link all workspace targets
        # On every Rust PR, link the Python library and all test targets, including the WASM crate.
        run: cargo build --workspace --all-targets --release --locked
      - name: Build and archive the workspace and every test
        run: cargo nextest archive --workspace --release --locked --zstd-level 1 --archive-file tests.tar.zst
      - name: Upload test archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-tests-ubuntu-latest
          path: tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Doctests
        run: cargo test --doc --workspace --release --locked --no-fail-fast

  shard:
    needs: build
    if: ${{ github.event_name != 'schedule' && !inputs.macos_only }}
    strategy:
      fail-fast: false
      matrix:
        # Run 45116003511 and local split timings project an 11–12 minute tail
        # with five hash shards. Four project over 13 minutes including setup.
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - *checkout
      - *corpus
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Match the build job's key and paths to restore its fetched sources.
          shared-key: linux-test-archive
          save-if: false
      - *nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-tests-ubuntu-latest
      - name: Run the archived tests
        # Restore target/ at the build's checkout path for the tests' compile-time paths.
        env:
          PARTITION: hash:${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          mkdir -p target/tmp
          cargo nextest run --archive-file tests.tar.zst --extract-to . --extract-overwrite --no-fail-fast \
            --partition "$PARTITION"

  # Maintainer decision, 2026-10-26: macOS PRs (and, since 2026-11-27, main pushes) build and
  # run only float-sensitive expectations; five macOS runners are shared across repos, so reduce runner-minutes
  # rather than add jobs/shards. Linux always runs everything. The full macOS suite runs
  # nightly, on dispatch (this workflow's, or ci.yml's) and on release* PR heads; main pushes
  # run the floating-point checks only.
  # The 25-minute target excludes full macOS runs. One runner projects to 44–45 minutes
  # (about 14 to build and 30 to run, based on main run 45079277931 and local timings).
  macos:
    runs-on: macos-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release')) && 110 || 32 }}
    env:
      FULL_SUITE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release') }}
    steps:
      - *checkout
      - *corpus
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test # retain the original macOS job's cache
      - *nextest
      - *fmt
      - *clippy
      - name: Full suite
        id: full-suite
        if: env.FULL_SUITE == 'true'
        run: cargo nextest run --workspace --release --locked --no-fail-fast
      - name: Doctests
        if: ${{ !cancelled() && (steps.full-suite.outcome == 'success' || steps.full-suite.outcome == 'failure') }}
        run: cargo test --doc --workspace --release --locked --no-fail-fast
      - name: macOS floating-point checks
        if: env.FULL_SUITE == 'false'
        # features: libm-dependent frame/recognition and rounded face records.
        # mesh: acos/sin, UV refinement, triangle winding/area and rounded bounds.
        # anchors: geometric integration and six-decimal leader positions/directions.
        # schema6: rotated slot end planes, frame roll and PMI coordinates.
        # resume: rounded centroids, signed zero and persisted fingerprint hashes.
        # revision: geometric correspondence, rounded report measurements and PNG projection.
        # characteristic_numbers: macOS-captured legacy serialization hashes.
        # pyfmt: exact binary rounding/formatting used by all these expectations.
        run: >-
          cargo nextest run --release --locked --no-fail-fast
          --test features --test mesh --test anchors --test schema6
          --test resume --test revision --test pyfmt --test characteristic_numbers
