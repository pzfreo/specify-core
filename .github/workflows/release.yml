name: Release WASM and UI

# A published v* release builds the engine (WASM) and the UI (ui/) from the tagged commit:
# - wasm: builds and checks the WASM, attaches specify-pmi-wasm-<version>.tgz (+ .sha256);
# - npm: publishes it as @draftwright/specify-pmi-wasm (environment `npm`);
# - ui: checks the tag, runs the UI's suites on that WASM, packs @draftwright/specify-ui;
# - app: builds the local app, compiles it and the WASM into the specify-pmi command from the
#   same commit (ADR P12), and runs the app's tests against that command's built-in app;
# - ui-npm: publishes @draftwright/specify-ui (environment `npm`) once its engine is on npm.
# The command line (cli.yml), crates.io (crates.yml) and PyPI (python.yml) run on the same
# release; each builds the app and WASM first (bundle.yml) and carries them, so `open` and MCP
# `show` download nothing. Versions are lockstep: the tag is the version of every package.
on:
  release:
    types: [published]
  # Publishes an existing release's WASM package to npm from its attached archive, e.g. a
  # release made before the npm job existed. Each run needs the maintainer's word.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose WASM archive to publish to npm, e.g. v0.1.17 (not needed with forwarders)
        required: false
        type: string
      forwarders:
        description: Publish the forwarding package for the old name (forwarders/) and nothing else
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-check:
    if: ${{ !inputs.forwarders && (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')) }}
    uses: ./.github/workflows/release-check.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}

  wasm:
    needs: release-check
    if: github.event_name == 'release' && needs.release-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Verify release version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          version = os.environ['TAG'].removeprefix('v')
          for path in ['Cargo.toml', 'crates/specify-pmi-wasm/Cargo.toml']:
              with open(path, 'rb') as source:
                  assert tomllib.load(source)['package']['version'] == version, path
          with open('ui/package.json', encoding='utf-8') as source:
              assert json.load(source)['version'] == version, 'ui/package.json'
          PY
      - run: wasm-pack build crates/specify-pmi-wasm --target web --profile wasm-release --locked
      # The UI jobs build and test on this very build (the same files the archive below holds).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-pkg
          path: crates/specify-pmi-wasm/pkg
          if-no-files-found: error
      - run: python3 tools/wasm_size.py
      - run: cargo build --locked --release -p specify-pmi-wasm --example parity_reference
      - run: node scripts/wasm-parity.mjs
      - run: node scripts/wasm-face-names.mjs
      - run: node scripts/wasm-hostile.mjs
      - name: Compare released editor kernel and annotate release (advisory)
        env:
          TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/check_quiddity_pin.py --release "$TAG"
      - name: Archive, checksum and attach package
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          archive="specify-pmi-wasm-${version}.tgz"
          # Apache-2.0 4(d): the NOTICE travels with the package (wasm-pack copies only LICENSE).
          cp NOTICE crates/specify-pmi-wasm/pkg/NOTICE
          tar -czf "$archive" -C crates/specify-pmi-wasm pkg
          sha256sum "$archive" > "$archive.sha256"
          gh release upload "$TAG" "$archive" "$archive.sha256" --clobber

  # Publishes the archive the wasm job attached to npm as @draftwright/specify-pmi-wasm: the
  # same files, with only package.json renamed to the scope and given publishConfig
  # (tools/npm_package.py). npm trusted publishing: the package trusts this repository, this
  # workflow and the `npm` environment, where the maintainer approves; no token is stored.
  # Pre-releases are published under `next`.
  npm:
    needs: [release-check, wasm]
    if: >-
      ${{ !cancelled() && needs.release-check.result == 'success' && needs.release-check.outputs.publish == 'true' &&
        (github.event_name == 'workflow_dispatch' || needs.wasm.result == 'success') }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          v=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -1)" != 11.5.1 ]; then
            echo "::error::npm $v is older than 11.5.1"
            exit 1
          fi
      - name: Download and verify the release archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::$TAG is not a release tag"; exit 1 ;; esac
          version="${TAG#v}"
          archive="specify-pmi-wasm-${version}.tgz"
          mkdir release && cd release
          gh release download "$TAG" -p "$archive" -p "$archive.sha256"
          sha256sum -c "$archive.sha256"
          tar -xzf "$archive"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # The tag must equal its version; the tarball must carry LICENSE and NOTICE.
      - name: Prepare and check the npm package
        run: python3 tools/npm_package.py release/pkg --version "$VERSION" --check-pack
      # A version already on npm is skipped, so a rerun or a dispatch of a published release
      # does nothing. An older version than npm's latest keeps `latest` where it is, under the
      # dist-tag release-<version> (npm refuses a dist-tag that is a semver range, like v0.1.16).
      - name: Decide whether and where to publish the WASM package
        id: decision
        env:
          PRERELEASE: ${{ needs.release-check.outputs.prerelease }}
        run: |
          url="https://registry.npmjs.org/@draftwright%2fspecify-pmi-wasm"
          status=$(curl -s --retry 3 -o /dev/null -w '%{http_code}' "$url/$VERSION")
          latest=
          if [ "$status" = 404 ] && [ "$PRERELEASE" = false ]; then
            # A package's first publish has no metadata yet (404): no latest to compare with.
            package_status=$(curl -s --retry 3 -o /dev/null -w '%{http_code}' "$url")
            if [ "$package_status" = 404 ]; then
              latest=none
            else
              metadata=$(curl -fsS --retry 3 "$url")
              latest=$(jq -r '."dist-tags".latest // empty' <<<"$metadata")
            fi
          fi
          python3 tools/release_version.py --channel npm --tag="$TAG" --prerelease="$PRERELEASE" \
            --registry-status="$status" --latest="$latest"
      # npm trusted publishing: npm exchanges the job's OIDC token (id-token: write), so no
      # secret is passed; a publish can only succeed through the trusted publisher.
      - name: Publish
        if: steps.decision.outputs.publish == 'true'
        env:
          DIST_TAG: ${{ steps.decision.outputs.dist_tag }}
        run: npm publish ./release/pkg --tag "$DIST_TAG"

  # The UI library, @draftwright/specify-ui, from ui/: the release guard, the suites on the WASM
  # the wasm job built, and the tarball (its engine dependency pinned to this version,
  # scripts/pack.mjs). Moved from specify-ui's release.yml.
  ui:
    needs: [release-check, wasm]
    if: needs.release-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0 # main's history, to check the tag is on it
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: crates/specify-pmi-wasm/pkg
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - name: Release guard
        # The release-check decision gates this job; the guard checks the checkout and built engine.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -u
          fail=0
          err() { echo "::error::$1"; fail=1; }
          pkg_version=$(node -p "require('./package.json').version")
          wasm_spec=$(node -p "require('./package.json').dependencies?.['@draftwright/specify-pmi-wasm'] ?? ''")
          wasm_built=$(node -p "require('../crates/specify-pmi-wasm/pkg/package.json').version")

          # A release on a v* tag whose commit is on main, never a branch or a stray commit.
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) err "The release ref is $GITHUB_REF, not a v* tag." ;;
          esac
          commit=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)
          if [ -z "$commit" ]; then
            err "Tag $TAG is not in the checkout."
          elif ! git merge-base --is-ancestor "$commit" origin/main; then
            err "Tag $TAG ($commit) is not on main."
          fi

          if [ "$TAG" != "v$pkg_version" ]; then
            err "Tag $TAG does not match ui/package.json version v$pkg_version."
          fi
          # In the repository the engine is the in-repo build; the tarball pins this version.
          if [ "$wasm_spec" != "file:../crates/specify-pmi-wasm/pkg" ]; then
            err "ui/package.json depends on @draftwright/specify-pmi-wasm '$wasm_spec', not the in-repo build."
          fi
          if [ "$wasm_built" != "$pkg_version" ]; then
            err "The WASM build is $wasm_built, ui/package.json $pkg_version: versions are lockstep."
          fi
          exit "$fail"
      - run: npm run fetch:wasm
      - run: npm run build
      - run: npm test
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:package
      # No scripts: prepack would rebuild; the tarball must hold the build that was tested.
      - name: Pack the tarball
        run: node scripts/pack.mjs ../npm-tarball
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: npm-tarball/*.tgz
          if-no-files-found: error

  # The local app `specify-pmi open` serves (ui/app): built, compiled with the WASM into the
  # specify-pmi command from this commit (build.rs), and tested against that command's built-in
  # app and engine (no --app, no --wasm), as the released binaries and wheels carry them.
  app:
    needs: wasm
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: crates/specify-pmi-wasm/pkg
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
        working-directory: ui
      - run: npm run fetch:wasm
        working-directory: ui
      - name: Build the local app
        working-directory: ui
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          npm run build:app
          version=$(node -p "require('./dist-app/specify-ui-app.json').version")
          [ "$TAG" = "v$version" ] || { echo "::error::Tag $TAG, app $version: they must agree."; exit 1; }
      - run: rustup toolchain install
      # SPECIFY_REQUIRE_BUNDLE: the build fails rather than leave the app or engine out.
      - name: Build the specify-pmi command with the app and engine
        env:
          SPECIFY_REQUIRE_BUNDLE: '1'
        run: |
          cargo build --release --locked --bin specify-pmi
          echo "SPECIFY_PMI=$PWD/target/release/specify-pmi" >> "$GITHUB_ENV"
      - name: Open serves the built-in app and engine
        run: |
          gunzip -c tests/fixtures/thread-depth-alpha7.step.gz > "$RUNNER_TEMP/part.step"
          python3 tools/open_smoke.py "$SPECIFY_PMI" "$RUNNER_TEMP/part.step"
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      # The app against `specify-pmi open` and `mcp`, served from the command itself.
      - name: Test the built-in app
        working-directory: ui
        env:
          SPECIFY_APP_BUILT_IN: '1'
        run: |
          node test/app-browser.mjs && node test/app-agent.mjs || {
            echo "::error::The local app's tests failed against this commit's specify-pmi with the app built in."
            exit 1
          }

  # Publishes @draftwright/specify-ui with npm trusted publishing (OIDC): configured on
  # npmjs.com for pzfreo/specify-pmi, release.yml and environment `npm`. No npm token is
  # passed. It waits for the engine it depends on to be published (the npm job above).
  ui-npm:
    needs: [release-check, ui, npm]
    if: needs.release-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: tarball
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11.20.0
      - name: Verify the tarball and decide whether and where to publish it
        id: decision
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ needs.release-check.outputs.prerelease }}
        run: |
          set -eu
          set -- ./tarball/*.tgz
          [ "$#" -eq 1 ] || { echo "::error::Expected one tarball, found $#."; exit 1; }
          file=$1 # ./ prefix: npm reads a bare "dir/file.tgz" as a GitHub owner/repo
          version=$(tar -xOzf "$file" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          engine=$(tar -xOzf "$file" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).dependencies['@draftwright/specify-pmi-wasm']")
          [ "$TAG" = "v$version" ] || { echo "::error::Tag $TAG does not match the tarball version $version."; exit 1; }
          [ "$engine" = "$version" ] || { echo "::error::The tarball depends on @draftwright/specify-pmi-wasm $engine, not $version."; exit 1; }
          # npm can take a few minutes to serve a version after publish succeeds.
          engine_package="@draftwright/specify-pmi-wasm@$engine"
          deadline=$((SECONDS + 300))
          attempt=0
          published=
          while (( (remaining = deadline - SECONDS) > 0 )); do
            attempt=$((attempt + 1))
            echo "Checking npm for $engine_package (attempt $attempt)."
            lookup_timeout=$((remaining < 10 ? remaining : 10))
            published=$(timeout -k 1s "${lookup_timeout}s" npm view --prefer-online --fetch-retries=0 \
              "$engine_package" version 2>/dev/null || true)
            [ "$published" = "$engine" ] && break
            (( deadline - SECONDS > 10 )) || break
            sleep 10
          done
          [ "$published" = "$engine" ] || { echo "::error::@draftwright/specify-pmi-wasm@$engine is not on npm."; exit 1; }
          status=404
          latest=
          if [ "$(npm view "@draftwright/specify-ui@$version" version 2>/dev/null || true)" = "$version" ]; then
            status=200
          elif [ "$PRERELEASE" = false ]; then
            latest=$(npm view "@draftwright/specify-ui" dist-tags.latest)
          fi
          python3 tools/release_version.py --channel npm --tag="$TAG" --prerelease="$PRERELEASE" \
            --registry-status="$status" --latest="$latest"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      # npm exchanges the job's OIDC token with the trusted publisher; no secret is used.
      - name: Publish
        if: steps.decision.outputs.publish == 'true'
        env:
          TARBALL: ${{ steps.decision.outputs.file }}
          DIST_TAG: ${{ steps.decision.outputs.dist_tag }}
        run: npm publish "$TARBALL" --provenance --access public --tag "$DIST_TAG"

  # The forwarding package for the old name, @draftwright/specify-core-wasm
  # (forwarders/npm/specify-core-wasm): only a dispatch with `forwarders` runs this, and then
  # nothing else does. Trusted publishing covers `npm publish` only, so deprecating the older
  # versions of the old name is not done here.
  forwarder:
    if: github.event_name == 'workflow_dispatch' && inputs.forwarders
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          v=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -1)" != 11.5.1 ]; then
            echo "::error::npm $v is older than 11.5.1"
            exit 1
          fi
      - name: Publish
        run: npm publish ./forwarders/npm/specify-core-wasm --provenance --access public
