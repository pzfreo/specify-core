[package]
name = "specify-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Interview-driven AP242 PMI authoring for STEP parts (Rust port of specify-core)"
repository = "https://github.com/pzfreo/specify-core-rust"

[[bin]]
name = "specify-core"
path = "src/main.rs"

[dependencies]
# quiddity-rust: feature recognition (quiddity) and the geometry kernel with STEP import and
# AP242 semantic PMI (haecceity). Pinned to rev a16d7af (head of branch ap242) until
# prototype/rust-port contains it; then both switch to branch prototype/rust-port. A rev, not
# the branch, because ap242 may move or be deleted once merged. See docs/design.md,
# "Dependency plan".
quiddity = { git = "https://github.com/pzfreo/quiddity-rust", rev = "a16d7af80e15b48be7c7e5a54f19afe59c9030eb" }
haecceity = { git = "https://github.com/pzfreo/quiddity-rust", rev = "a16d7af80e15b48be7c7e5a54f19afe59c9030eb" }
base64 = "0.22.1"
# specify-core reads typed specs and added requirements with regular expressions (choices, extras).
regex = "1.11.1"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: objects keep their insertion order, as Python's dicts do, so the JSON formats
# read in the same order as specify-core's.
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.0"
# Constrained Delaunay triangulation of faces in their parameter space (triangulate.rs, the
# stand-in for haecceity face meshing, upstream need U4).
spade = "2.15.1"

[dev-dependencies]
flate2 = "1.1.10"
