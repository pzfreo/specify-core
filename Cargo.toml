[workspace]
members = ["crates/specify-core-wasm"]
default-members = ["."]
resolver = "3"

[package]
name = "specify-core"
version = "0.1.0-alpha.4"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Interview-driven AP242 PMI authoring for STEP parts (Rust port of specify-core)"
repository = "https://github.com/pzfreo/specify-core-rust"

[[bin]]
name = "specify-core"
path = "src/main.rs"

[dependencies]
# quiddity-rust: feature recognition (quiddity) and the geometry kernel with STEP import and
# AP242 semantic PMI (haecceity). Both are pinned by rev to quiddity-rust's 0.1.0-alpha.4 release
# commit f5ddb72 (the merge of its release PR #13); no tag exists yet, so a tag pin can replace
# the rev once v0.1.0-alpha.4 is tagged at this commit.
# See docs/design.md, "Dependency plan".
quiddity = { git = "https://github.com/pzfreo/quiddity-rust", rev = "f5ddb726783f2e9384a55164eb7e36a1ec9a6f7c" }
haecceity = { git = "https://github.com/pzfreo/quiddity-rust", rev = "f5ddb726783f2e9384a55164eb7e36a1ec9a6f7c" }
base64 = "0.22.1"
# Gzipped STEP input is decompressed in memory, and a `.gz` destination written gzipped.
flate2 = "1.1.10"
# Overlap area of two facing flat faces (mates::contacts): haecceity has no face boolean yet
# (upstream need U5), so the faces' boundaries are intersected as polygons with holes.
i_overlay = "8.1.2"
# specify-core reads typed specs and added requirements with regular expressions (choices, extras).
regex = "1.11.1"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: objects keep their insertion order, as Python's dicts do, so the JSON formats
# read in the same order as specify-core's.
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.0"
# Constrained Delaunay triangulation of faces in their parameter space (triangulate.rs, the
# stand-in for haecceity face meshing, upstream need U4).
spade = "2.15.1"

[dev-dependencies]
flate2 = "1.1.10"

[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 1
opt-level = 3
