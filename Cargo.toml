[workspace]
members = ["crates/specify-core-wasm", "crates/specify-core-py"]
default-members = ["."]
resolver = "3"

[package]
name = "specify-core"
version = "0.1.13"
edition = "2024"
license = "Apache-2.0"
description = "Interview-driven AP242 PMI authoring for STEP parts (Rust port of specify-core)"
repository = "https://github.com/pzfreo/specify-core"

[[bin]]
name = "specify-core"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command line (src/cli.rs, the binary and the Python console script). The WASM build
# turns it off so clap stays out of the browser bundle.
cli = ["dep:clap", "dep:clap_complete"]

[dependencies]
# The command line's parser, and its shell completion scripts (`specify-core completions`).
clap = { version = "4.6.1", features = ["derive"], optional = true }
clap_complete = { version = "4.6", optional = true }
# pzfreo/quiddity: feature recognition (quiddity) and the geometry kernel with STEP import and
# AP242 semantic PMI (haecceity). Both use tagged v0.4.9.
# See docs/design.md, "Dependency plan".
quiddity = { git = "https://github.com/pzfreo/quiddity", tag = "v0.4.9", default-features = false, features = ["presentation"] }
haecceity = { git = "https://github.com/pzfreo/quiddity", tag = "v0.4.9", features = ["json"] }
# The kernel's own unit reader also converts planner supplemental points into file units.
step-io = "0.3.0"
base64 = "0.22.1"
# Gzipped STEP input is decompressed in memory, and a `.gz` destination written gzipped.
flate2 = "1.1.10"
# Overlap area of two facing flat faces (mates::contacts): haecceity has no face boolean yet
# (upstream need U5), so the faces' boundaries are intersected as polygons with holes.
i_overlay = "8.1.2"
# specify-core reads typed specs and added requirements with regular expressions (choices, extras).
regex = "1.11.1"
# The revision picture (revision.rs) is written as a PNG.
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order: objects keep their insertion order, as Python's dicts do, so the JSON formats
# read in the same order as specify-core's.
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11.0"
# Constrained Delaunay triangulation of faces in their parameter space (triangulate.rs, the
# stand-in for haecceity face meshing, upstream need U4).
spade = "2.15.1"

[dev-dependencies]
flate2 = "1.1.10"

[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 1
opt-level = 3
