[package]
name = "specify-core-py"
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
description = "Python bindings for specify-core: the Python package's API on the Rust engine"
repository = "https://github.com/pzfreo/specify-core-rust"
readme = "README.md"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
# The module is tested from Python (tests/python); Rust unit tests would need libpython linked.
test = false
doctest = false

[dependencies]
specify-core = { path = "../..", version = "=0.1.4" }
# abi3-py312: one wheel per platform for every CPython from 3.12, as specify-core supports.
# No `extension-module` feature: maturin sets PYO3_BUILD_EXTENSION_MODULE, and without it
# `cargo test --workspace` still links.
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
serde_json = "1.0.151"
