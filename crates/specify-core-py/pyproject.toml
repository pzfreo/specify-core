[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "specify-core"
version = "0.1.5"
description = "Add manufacturing intent (GD&T, fits, threads, finish) to STEP parts and write it as AP242 semantic PMI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Paul Fremantle" }]
keywords = ["step", "ap242", "pmi", "gd&t", "mbd", "cad", "manufacturing", "tolerancing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
]
requires-python = ">=3.12"
# None: the Rust engine needs neither quiddity, build123d nor OCP.
dependencies = []

[project.urls]
Homepage = "https://editor.draftwright.io/specify"
Source = "https://github.com/pzfreo/specify-core"
Issues = "https://github.com/pzfreo/specify-core/issues"
Changelog = "https://github.com/pzfreo/specify-core/blob/main/CHANGELOG.md"
Documentation = "https://github.com/pzfreo/specify-core/blob/main/crates/specify-core-py/README.md"

[project.scripts]
# The engine's command line; specify-core's second name for it, pmi-assist, is not kept.
specify-core = "specify_core.cli:run"

[tool.maturin]
python-source = "python"
module-name = "specify_core._native"
manifest-path = "Cargo.toml"
strip = true
exclude = ["**/__pycache__/**"]
