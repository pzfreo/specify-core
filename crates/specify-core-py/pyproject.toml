[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "specify-core"
version = "0.1.3"
description = "Interview-driven PMI authoring: recognise features, ask for missing intent, write AP242 semantic PMI"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Paul Fremantle" }]
requires-python = ">=3.12,<3.15"
# None: the Rust engine needs neither quiddity, build123d nor OCP.
dependencies = []

[tool.maturin]
python-source = "python"
module-name = "specify_core._native"
manifest-path = "Cargo.toml"
strip = true
exclude = ["**/__pycache__/**"]
