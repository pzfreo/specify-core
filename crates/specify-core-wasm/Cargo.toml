[package]
name = "specify-core-wasm"
version = "0.1.0-alpha.4"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Browser bindings for Specify's questions and manufacturing intent"
repository = "https://github.com/pzfreo/specify-core-rust"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
specify-core = { path = "../..", version = "=0.1.0-alpha.4" }
haecceity = { git = "https://github.com/pzfreo/quiddity-rust", rev = "f5ddb726783f2e9384a55164eb7e36a1ec9a6f7c" }
serde_json = "1.0.151"
sha2 = "0.11.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

