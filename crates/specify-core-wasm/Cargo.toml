[package]
name = "specify-core-wasm"
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
description = "Browser bindings for Specify's questions and manufacturing intent"
repository = "https://github.com/pzfreo/specify-core-rust"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
specify-core = { path = "../..", version = "=0.1.4" }
# Keep the geometry/PMI kernel on the same v0.2.7 release commit as the root crate.
haecceity = { git = "https://github.com/pzfreo/quiddity-rust", tag = "v0.2.7" }
serde_json = "1.0.151"
sha2 = "0.11.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

