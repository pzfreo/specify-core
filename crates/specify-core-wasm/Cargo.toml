[package]
name = "specify-core-wasm"
version = "0.1.0-alpha.7"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Browser bindings for Specify's questions and manufacturing intent"
repository = "https://github.com/pzfreo/specify-core-rust"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
specify-core = { path = "../..", version = "=0.1.0-alpha.7" }
# Keep the geometry/PMI kernel on the same release commit as the root crate.
haecceity = { git = "https://github.com/pzfreo/quiddity-rust", tag = "v0.2.0-alpha.1" }
serde_json = "1.0.151"
sha2 = "0.11.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

